services:
  # 1. BASE DE DATOS RELACIONAL (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: postgres_consultoria
    restart: always
    environment:
      POSTGRES_DB: consultoria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BASE DE DATOS NOSQL (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: mongo_consultoria
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: logs_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. BACKEND (Django REST)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=consultoria_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=mongoadmin
      - MONGO_PASSWORD=secretpassword
      - MONGO_DB_NAME=logs_db
    depends_on:
      - db
      - mongodb

  # 4. FRONTEND (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  frontend_node_modules: