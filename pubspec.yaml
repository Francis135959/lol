name: desarrollo_movil
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  go_router: ^17.2.3
  get_it: ^8.0.0
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.2.0
  cloud_firestore: ^5.4.4
  connectivity_plus: ^6.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.1
  permission_handler: ^12.0.3
  file_picker: ^11.0.2
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.7

flutter:
  uses-material-design: true

  assets:
  # - assets/icon/
  #  - assets/splash/


flutter_launcher_icons: #icono de escritorio 
  android: "launcher_icon"
  ios: true

  image_path: "assets/branding/icono_foreground.png" 
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/branding/icono_foreground.png"


flutter_native_splash: #icono de pantalla de carga 
  color: "#1E3A5F"
  image: "assets/branding/isotipo_foreground.png" 
  fullscreen: false
  
  android_12:
    color: "#1E3A5F"
    image: "assets/branding/isotipo_foreground.png"